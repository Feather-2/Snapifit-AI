  #     - redis-data:/data
  #   networks:
  #     - snapfit-network
  #   command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3

  # Nginx 反向代理（可选）
  # nginx:
  #   image: nginx:alpine
  #   container_name: snapfit-nginx-single
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - snapfit-ai
  #   networks:
  #     - snapfit-network
  #   restart: unless-stopped

# ==========================================
# 网络配置
# ==========================================
networks:
  snapfit-network:
    driver: bridge
    name: snapfit-single-network
    ipam:
      config:
        - subnet: 172.21.0.0/16

# ==========================================
# 卷配置
# ==========================================
volumes:
  # 应用缓存
  app-cache:
    driver: local
    name: snapfit-single-app-cache

  # Redis 数据（如果启用）
  # redis-data:
  #   driver: local
  #   name: snapfit-single-redis-data

# ==========================================
# 配置说明
# ==========================================
# 1. 此配置适用于连接外部 Supabase 数据库
# 2. 环境变量通过 .env 文件配置
# 3. 默认端口 3000，可通过 APP_PORT 环境变量修改
# 4. 支持健康检查和自动重启
# 5. 包含资源限制和日志轮转
# 6. 可选服务（Redis、Nginx）默认禁用
# 7. 支持 Traefik 标签用于反向代理
# 8. 与 docker-full 的区别：不包含 PostgreSQL 容器
#
# 使用方法:
# 1. 配置 .env 文件中的 Supabase 连接信息
# 2. 运行: docker-compose up -d
# 3. 访问: http://localhost:3000
#
# 优势:
# - 轻量级部署（只有应用容器）
# - 使用托管数据库（Supabase）
# - 快速启动和扩展
# - 适合云环境部署
# ==========================================
