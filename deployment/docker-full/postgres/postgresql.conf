# SnapFit AI - PostgreSQL 配置文件
# 简化配置，避免兼容性问题

# ==========================================
# 连接和认证设置
# ==========================================
listen_addresses = '*'
port = 5432
max_connections = 100

# ==========================================
# 基本设置
# ==========================================
shared_buffers = 128MB
work_mem = 4MB
maintenance_work_mem = 64MB

# ==========================================
# 日志设置
# ==========================================
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
log_timezone = 'UTC'

# ==========================================
# 客户端连接默认值
# ==========================================
timezone = 'UTC'

# ==========================================
# 自动清理
# ==========================================
autovacuum = on
