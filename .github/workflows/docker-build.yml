name: Build and Push Docker Images

on:
  push:
    branches: [ main, master, develop, pro, enterprise ]
    tags: [ 'v*', 'pro-v*', 'enterprise-v*' ]
  pull_request:
    branches: [ main, master, develop, pro, enterprise ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Generate docker-compose files
      if: github.event_name != 'pull_request'
      run: |
        mkdir -p release

        # 生成 docker-compose.yml (使用外部数据库)
        cat > release/docker-compose.yml << 'EOF'
        version: '3.8'

        services:
          snapfit-ai:
            image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            container_name: snapfit-ai
            ports:
              - "38000:3000"
            environment:
              # 数据库配置 (外部PostgreSQL)
              - DATABASE_URL=postgresql://username:password@your-db-host:5432/snapfit_ai

              # 基础配置
              - NODE_ENV=production
              - NEXTAUTH_SECRET=your-nextauth-secret-here
              - NEXTAUTH_URL=http://localhost:38000

              # AI服务配置
              - OPENAI_API_KEY=your-openai-api-key
              - OPENAI_BASE_URL=https://api.openai.com/v1

              # 邮件服务配置 (可选)
              - RESEND_API_KEY=your-resend-api-key
              - SMTP_HOST=smtp.gmail.com
              - SMTP_PORT=587
              - SMTP_USER=your-email@gmail.com
              - SMTP_PASS=your-app-password

              # 安全配置
              - ALLOW_NON_THIRD_PARTY_SOURCES=false
              - RATE_LIMIT_ENABLED=true
              - INVITE_CODE_REQUIRED=true
              - INVITE_CODE=your-invite-code

              # 日志配置
              - LOG_LEVEL=info

            volumes:
              - snapfit_data:/app/data
            restart: unless-stopped
            healthcheck:
              test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
              interval: 30s
              timeout: 10s
              retries: 3

        volumes:
          snapfit_data:
        EOF

        # 生成 docker-compose.full.yml (包含PostgreSQL)
        cat > release/docker-compose.full.yml << 'EOF'
        version: '3.8'

        services:
          postgres:
            image: supabase/postgres:17.4.1.043
            container_name: snapfit-postgres
            environment:
              - POSTGRES_DB=snapfit_ai
              - POSTGRES_USER=snapfit_user
              - POSTGRES_PASSWORD=snapfit_password
              - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
            volumes:
              - postgres_data:/var/lib/postgresql/data
              - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
            ports:
              - "5432:5432"
            restart: unless-stopped
            healthcheck:
              test: ["CMD-SHELL", "pg_isready -U snapfit_user -d snapfit_ai"]
              interval: 10s
              timeout: 5s
              retries: 5

          snapfit-ai:
            image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            container_name: snapfit-ai
            depends_on:
              postgres:
                condition: service_healthy
            ports:
              - "38000:3000"
            environment:
              # 数据库配置 (内部PostgreSQL)
              - DATABASE_URL=postgresql://snapfit_user:snapfit_password@postgres:5432/snapfit_ai

              # 基础配置
              - NODE_ENV=production
              - NEXTAUTH_SECRET=your-nextauth-secret-here
              - NEXTAUTH_URL=http://localhost:38000

              # AI服务配置
              - OPENAI_API_KEY=your-openai-api-key
              - OPENAI_BASE_URL=https://api.openai.com/v1

              # 邮件服务配置 (可选)
              - RESEND_API_KEY=your-resend-api-key

              # 安全配置
              - ALLOW_NON_THIRD_PARTY_SOURCES=false
              - RATE_LIMIT_ENABLED=true
              - INVITE_CODE_REQUIRED=true
              - INVITE_CODE=your-invite-code

              # 日志配置
              - LOG_LEVEL=info

            volumes:
              - snapfit_data:/app/data
            restart: unless-stopped
            healthcheck:
              test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
              interval: 30s
              timeout: 10s
              retries: 3

        volumes:
          postgres_data:
          snapfit_data:
        EOF

        # 生成环境变量模板
        cat > release/.env.example << 'EOF'
        # ===========================================
        # SnapFit AI 环境配置文件
        # ===========================================

        # 数据库配置
        DATABASE_URL=postgresql://username:password@localhost:5432/snapfit_ai

        # 基础配置
        NODE_ENV=production
        NEXTAUTH_SECRET=your-very-long-random-secret-string-here
        NEXTAUTH_URL=http://localhost:38000

        # AI服务配置
        OPENAI_API_KEY=sk-your-openai-api-key-here
        OPENAI_BASE_URL=https://api.openai.com/v1

        # 邮件服务配置 (二选一)
        # Resend (推荐)
        RESEND_API_KEY=re_your-resend-api-key-here

        # 或者 SMTP
        SMTP_HOST=smtp.gmail.com
        SMTP_PORT=587
        SMTP_USER=your-email@gmail.com
        SMTP_PASS=your-app-password

        # 安全配置
        ALLOW_NON_THIRD_PARTY_SOURCES=false
        RATE_LIMIT_ENABLED=true
        INVITE_CODE_REQUIRED=true
        INVITE_CODE=your-invite-code-here

        # 日志配置
        LOG_LEVEL=info

        # OAuth配置 (可选)
        # GITHUB_CLIENT_ID=your-github-client-id
        # GITHUB_CLIENT_SECRET=your-github-client-secret
        EOF

    - name: Upload release artifacts
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: docker-compose-files
        path: release/
        retention-days: 90

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          release/docker-compose.yml
          release/docker-compose.full.yml
          release/.env.example
        body: |
          ## SnapFit AI ${{ github.ref_name }}

          ### 🚀 快速部署

          #### 方式1：使用外部数据库
          ```bash
          # 下载配置文件
          wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/docker-compose.yml
          wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/.env.example

          # 配置环境变量
          cp .env.example .env
          # 编辑 .env 文件，填入您的配置

          # 启动服务
          docker-compose up -d
          ```

          #### 方式2：包含PostgreSQL数据库
          ```bash
          # 下载完整配置
          wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/docker-compose.full.yml
          wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/.env.example

          # 配置环境变量
          cp .env.example .env
          # 编辑 .env 文件

          # 启动服务
          docker-compose -f docker-compose.full.yml up -d
          ```

          ### 📋 更新日志
          - Docker镜像: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}`
          - 支持 linux/amd64 和 linux/arm64 架构
          - 包含完整的生产环境配置

          ### 🔧 配置说明
          请参考 `.env.example` 文件配置您的环境变量。
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
